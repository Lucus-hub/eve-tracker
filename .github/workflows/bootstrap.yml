name: Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fix SC3070L Music Store price (v24, manual dated)
        run: |
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("data/history.json","utf8"));d.history["SC3070L|musikstore"]=[{month:"2026-10",price:1349,ts:"2026-10-20T18:00:00.000Z",confidence:"manual"}];fs.writeFileSync("data/history.json",JSON.stringify(d,null,2)+String.fromCharCode(10))'

      - name: Commit v24
        run: |
          git config user.name "eve-tracker-bot"
          git config user.email "actions@github.com"
          git add data/history.json
          git commit -m "fix v24: SC3070L Music Store 1349 EUR"
          git push
