          printf %s "$B" | base64 -d > app/src/App.jsx
          grep -c 'text-left text-\[15px\] font-bold' app/src/App.jsx
          grep -c 'justify-end gap-1 text-\[10px\]' app/src/App.jsx

      - name: Commit v18
        run: |
          set -e
          git config user.name "eve-tracker-bot"
          git config user.email "actions@github.com"
          git add app/src/App.jsx
          git commit -m "v18 - price cells: bold 15px price left, small pct right"
          git push

      - name: Report
        run: |
          echo "App v18 commitee"
          echo "Prochaine etape - onglet Actions > Scrape and Deploy > Run workflow"
