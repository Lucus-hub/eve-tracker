name: Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fix Music Store prices (v21, manual dated)
        run: |
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("data/history.json","utf8"));const ts="2026-10-20T10:00:00.000Z";const mk=(p)=>[{month:"2026-10",price:p,ts:ts,confidence:"manual"}];const H=d.history;H["EXO25|musikstore"]=mk(525);H["SC3010|musikstore"]=mk(3629.2);H["SC3012|musikstore"]=mk(4536.8);H["SC3070R|musikstore"]=mk(1489);H["SC3070L|musikstore"]=mk(1489);H["SC305|musikstore"]=mk(799);H["SC307|musikstore"]=mk(979);H["SC2070|musikstore"]=mk(888);H["SC4070|musikstore"]=mk(2099);fs.writeFileSync("data/history.json",JSON.stringify(d,null,2)+String.fromCharCode(10))'

      - name: Commit v21
        run: |
          git config user.name "eve-tracker-bot"
          git config user.email "actions@github.com"
          git add data/history.json
          git commit -m "fix v21: correct Music Store prices (EXO25, SC301x, SC307x, SC205-4070)"
          git push
