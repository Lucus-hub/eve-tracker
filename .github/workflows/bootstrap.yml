name: Bootstrap - mise a jour EVE Tracker (v18)

# v18 : dernier ajustement d'alignement dans les cellules de prix
#   (conforme a la demande du user du 19/10/2026) :
#   - cellule entiere coloree en fond heat (inchange depuis v17),
#   - PRIX constate : en GRAS, 15px, aligne a GAUCHE,
#   - POURCENTAGE d'ecart MSRP : en petit (10px), aligne a DROITE
#     sous le prix, avec point fraicheur, variation et drapeau stock.
#   Meilleur prix : contour vert sur le bord de la cellule.
#   Ruptures : cellule grisee, prix barre a gauche, marqueur rupture a droite.
# Ne modifie QUE app/src/App.jsx.
# Fichier 100% ASCII : aucun accent dans le YAML.
# Usage unique : onglet Actions > Bootstrap > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

