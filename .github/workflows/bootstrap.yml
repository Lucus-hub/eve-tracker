name: Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fix Von Broenner EXO27 price 649 -> 639 (v27, manual dated)
        run: |
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("data/history.json","utf8"));d.history["EXO27|vonbroenner"]=[{month:"2026-11",price:639,ts:"2026-11-10T10:00:00.000Z",confidence:"manual"}];fs.writeFileSync("data/history.json",JSON.stringify(d,null,2)+String.fromCharCode(10))'

      - name: Commit v27
        run: |
          git config user.name "eve-tracker-bot"
          git config user.email "actions@github.com"
          git add data/history.json
          git commit -m "fix v27: Von Broenner EXO27 639 EUR (verified on product page)"
          git push
