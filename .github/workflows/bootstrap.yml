name: Bootstrap - mise a jour EVE Tracker (v11)

# v11 : onglet Revendeurs - medailles/podium supprimes. La cellule
# "Ecart moyen MSRP" utilise le meme code couleur heat que la matrice
# (rouge fonce = discount profond qui casse le marche, bleu = au MSRP,
# vert = au-dessus). Un outil de veille tarifaire neutre et factuel.
# Ce workflow ne modifie QUE app/src/App.jsx.
# Fichier 100% ASCII : aucun accent dans le YAML.
# Usage unique : onglet Actions > Bootstrap > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
