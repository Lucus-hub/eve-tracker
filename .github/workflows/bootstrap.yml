name: Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fix EXO28 prices (thomann and musikstore, 849 EUR, manual dated)
        run: |
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/history.json','utf8'));const ts='2026-10-19T15:00:00.000Z';d.history['EXO28|thomann']=[{month:'2026-10',price:849,ts:ts,confidence:'manual'}];d.history['EXO28|musikstore']=[{month:'2026-10',price:849,ts:ts,confidence:'manual'}];fs.writeFileSync('data/history.json',JSON.stringify(d,null,2)+String.fromCharCode(10))"

      - name: Restore Tailwind CSS in app/index.html (v19)
        run: |
          B=""
          B+=""
          printf %s "$B" | base64 -d > app/index.html

      - name: Commit v19
        run: |
          git config user.name "eve-tracker-bot"
          git config user.email "actions@github.com"
          git add data/history.json app/index.html
          git commit -m "fix v19: EXO28 prices 849 EUR (thomann, musikstore) + restore Tailwind CSS"
          git push
