name: Bootstrap - mise a jour EVE Tracker (v16)

# v16 : correction de la mise en forme des cellules de prix :
#   1. taille originale des pastilles conservee (min-w 64px, retour
#      au format empile sur deux lignes),
#   2. prix constate en GRAS et en plus GRAND (15px au lieu de 14),
#   3. pourcentage d'ecart MSRP en petit, aligne a GAUCHE sous le
#      prix (avec point fraicheur, variation et drapeau stock).
#   Applique aussi aux cellules de rupture (prix barre).
# Ne modifie QUE app/src/App.jsx.
# Fichier 100% ASCII : aucun accent dans le YAML.
# Usage unique : onglet Actions > Bootstrap > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
