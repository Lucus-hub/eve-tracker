name: Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Patch App.jsx v25 (global data freshness banner)
        run: |
          B=""
          B+=""
          B+=""
          B+=""
          B+=""
          B+=""
          B+="IGJhbm5lciArICJcblxuICAgICAgICB7c2VsZWN0ZWQgPyAoIjsKaWYgKCFjLmluY2x1ZGVzKGFuY2hvcjIpKSB0aHJvdyBuZXcgRXJyb3IoInYyNTogYW5jcmUgMiBpbnRyb3V2YWJsZSIpOwpjID0gYy5zcGxpdChhbmNob3IyKS5qb2luKGFkZDIpOwoKZnMud3JpdGVGaWxlU3luYygiYXBwL3NyYy9BcHAuanN4IiwgYyk7CmNvbnNvbGUubG9nKCJBcHAuanN4IHBhdGNoZSB2MjUiKTsK"
          printf %s "$B" | base64 -d > /tmp/patch-v25.cjs
          node /tmp/patch-v25.cjs

      - name: Commit v25
        run: |
          git config user.name "eve-tracker-bot"
          git config user.email "actions@github.com"
          git add app/src/App.jsx
          git commit -m "v25: global data freshness banner (last collection age)"
          git push
