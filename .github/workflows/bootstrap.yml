name: Bootstrap - mise a jour EVE Tracker (v14)

# v14 : retrait de Gear4Music du suivi (demande du 19/10/2026) :
#   - scraper.ts : domaine gear4music.com/.fr retire de la liste blanche,
#     bloc revendeur et table g4mIds supprimes.
#   - app/src/App.jsx : colonne Gear4Music retiree, matrice prix restylee
#     (en-tete degrade, pastilles arrondies par cellule, meilleur prix du
#     marche surligne, colonnes de stats separees, legende en panneau).
# Fichier 100% ASCII : aucun accent dans le YAML.
# Usage unique : onglet Actions > Bootstrap > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Gear4Music from scraper (python edit)
        run: |
          set -e
          python3 - <<'PYEOF'
          import re
          p = "scraper/scraper.ts"
          s = open(p, encoding="utf-8").read()
          before = s
          # 1. whitelist domains
          s = re.sub(r',\s*"gear4music\.(?:com|fr)"', "", s)
          # 2. retailer config block (from opening brace line to its closing brace)
          s = re.sub(r'\n  \{\n    id: "gear4music".*?\n  \},', "", s, flags=re.S)
          # 3. g4m product id table
          s = re.sub(r'\nconst g4mIds: Record<string, string> = \{[^;]*?;', "", s, flags=re.S)
          if s == before:
              raise SystemExit("ERROR: no Gear4Music block found in scraper.ts")
          for pat in ["gear4music"]:
              if pat in s:
                  # comments may still mention it, that is OK ; only config must be gone
                  pass
          open(p, "w", encoding="utf-8").write(s)
          print("scraper.ts: Gear4Music removed")
          PYEOF
          grep -c 'id: "gear4music"' scraper/scraper.ts && exit 1 || true
          grep -c 'gear4music.com' scraper/scraper.ts && exit 1 || true

