name: Bootstrap - mise a jour EVE Tracker (v13)

# v13 : completion Music Store - 4 references manquantes relevees le
# 19/10/2026 sur musicstore.com (storefront fr_FR) :
#   EXO24 429 EUR (en stock), EXO27 649 EUR (en stock),
#   SC203SET 499 EUR (rupture, livraison ~28/05), SC3012 4536.80 EUR
#   (rupture, livraison ~28/05). Prix manuels dates.
# NB : Michenaud ne reference pas le TS112 (cellule n/r = correct).
# Ce workflow ne modifie QUE data/history.json.
# Fichier 100% ASCII : aucun accent dans le YAML.
# Usage unique : onglet Actions > Bootstrap > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
