name: Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Patch App.jsx v23 (summary columns colors aligned with heat map)
        run: |
          node -e 'const fs=require("fs");let c=fs.readFileSync("app/src/App.jsx","utf8");const rep=(f,t)=>{if(!c.includes(f))throw new Error("v23 introuvable: "+f.slice(0,40));c=c.split(f).join(t)};rep("text-emerald-300\">Prix min","text-red-300\">Prix min");rep("text-rose-300\">Prix max","text-emerald-300\">Prix max");rep("text-emerald-700\">{eurShort(s.min)}","text-red-700\">{eurShort(s.min)}");rep("text-rose-700\">{eurShort(s.max)}","text-emerald-700\">{eurShort(s.max)}");rep("bg-emerald-100 text-emerald-800","__TMP__");rep("bg-red-100 text-red-800","bg-emerald-100 text-emerald-800");rep("__TMP__","bg-red-100 text-red-800");rep("bg-lime-100 text-lime-800","bg-orange-100 text-orange-800");fs.writeFileSync("app/src/App.jsx",c);console.log("App.jsx patche v23")'

      - name: Commit v23
        run: |
          git config user.name "eve-tracker-bot"
          git config user.email "actions@github.com"
          git add app/src/App.jsx
          git commit -m "v23: summary columns colors aligned with heat map (min red, max green, gap pill inverted)"
          git push
