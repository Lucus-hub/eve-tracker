name: Bootstrap - mise a jour EVE Tracker (v8.1)

# v8.1 : fichier 100% ASCII (le YAML ne doit contenir aucun accent ni
# tiret long : un collage precedent avait produit des caracteres de
# controle qui rendaient le workflow invalide). Le contenu des 3
# fichiers (accents compris) voyage dans les chunks base64 ci-dessous.
# v8 : SC3070 separee en SC3070L (gauche) / SC3070R (droite), fiches
# directes Sonovente et Univers Sons, prix releves le 15/10/2026.
# Usage unique : onglet Actions > Bootstrap > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

